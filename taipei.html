
<!DOCTYPE html>

        body {

<body>
    <div class="card">
        <h1>大稻埕：走進老台北的時光</h1>
        <p>台北記憶導覽｜景點 01</p>

        <h2>景點故事</h2>
        <p>
            大稻埕曾是台北重要的商業街區。
            如今走進迪化街，仍能看見許多
            傳統街屋與老店。
        </p>

        <h2>食物與記憶</h2>
        <p>
            從傳統糕餅到茶文化，
            食物也記錄著城市的生活方式。
        </p>

        <h2>實地導覽</h2>
